<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | Kopi Tenan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-halaman="admin-login">

  <header class="atas">
    <div class="atas-isi">
      <a href="index.html" class="logo">Kopi Tenan <small>admin</small></a>
      <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-menu.html">Menu</a>
        <a href="admin-pesanan.html">Pesanan</a>
        <a href="admin-laporan.html">Laporan</a>
        <a href="admin-info.html">Info</a>
      </nav>
    </div>
  </header>

  <main>
    <form id="form-login" class="panel kotak-sempit">
      <h1>Login Admin</h1>

      <label>Username
        <input type="text" name="username" autocomplete="username" required>
      </label>

      <label>Kata sandi
        <input type="password" name="sandi" autocomplete="current-password" required>
      </label>

      <p class="galat" id="pesan-login" hidden>Username atau kata sandi salah.</p>
      <button type="submit" class="tombol">Masuk</button>
      <p><small>Untuk percobaan: admin / admin123</small></p>
    </form>
  </main>

  <footer class="bawah">
    <div class="bawah-isi">
      <span>Panel admin Kopi Tenan</span>
      <a href="index.html">Lihat website</a>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/umum.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
